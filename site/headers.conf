# Чат поддержки OMNIQ (AIGW-36) это единственное, что сайт берёт не со своего адреса:
# скрипт https://omniq.pro/widget.js и его запросы к https://omniq.pro/api/v1/portal/.
# Хэш в style-src разрешает один блок <style>, который добавляет widget.js (цвет подсказок в полях).
# Если OMNIQ поменяет этот блок, чат продолжит работать, в консоли появится отказ CSP: хэш надо пересчитать.
# style-src-attr нужен для оформления ответов помощника (атрибуты style в разметке сообщений).
add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://omniq.pro/widget.js; style-src 'self' 'sha256-Is7rLi2OHF3kTylCBR/y4Q8f+VxulY+sh3sl9MVBKOU='; style-src-attr 'unsafe-inline'; connect-src https://omniq.pro/api/v1/portal/; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
