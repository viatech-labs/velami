map $http_accept_language $velami_lang {
    default en;
    "~*^\s*it" it;
    "~*^\s*ru" ru;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/plain application/xml image/svg+xml;

    gzip on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/css text/plain application/xml image/svg+xml;

    if ($host = www.velami.pro) {
        return 301 https://velami.pro$request_uri;
    }

    error_page 404 = @home;
    location @home {
        return 302 /;
    }

    location = / {
        include /etc/nginx/velami/headers.conf;
        add_header Vary Accept-Language always;
        add_header Content-Language $velami_lang always;
        add_header Cache-Control "no-cache" always;
        try_files /index.$velami_lang.html =404;
    }

    location = /privacy {
        include /etc/nginx/velami/headers.conf;
        add_header Vary Accept-Language always;
        add_header Content-Language $velami_lang always;
        add_header Cache-Control "no-cache" always;
        try_files /privacy.$velami_lang.html =404;
    }

    location ~ ^/(?<l>en|it|ru)/$ {
        include /etc/nginx/velami/headers.conf;
        add_header Content-Language $l always;
        add_header Cache-Control "no-cache" always;
        try_files /index.$l.html =404;
    }

    location ~ ^/(?<l>en|it|ru)/privacy$ {
        include /etc/nginx/velami/headers.conf;
        add_header Content-Language $l always;
        add_header Cache-Control "no-cache" always;
        try_files /privacy.$l.html =404;
    }

    location ~ ^/(en|it|ru)$ {
        return 301 /$1/;
    }

    location ~ ^/(index|privacy)\.(en|it|ru)\.html$ {
        return 301 /$2/;
    }

    location = /.well-known/security.txt {
        include /etc/nginx/velami/headers.conf;
        default_type text/plain;
        try_files /.well-known-security.txt =404;
    }

    location = /style.css {
        include /etc/nginx/velami/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(webp|png|svg|ico)$ {
        include /etc/nginx/velami/headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        include /etc/nginx/velami/headers.conf;
        try_files $uri =404;
    }
}
